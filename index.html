<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IATA | Design Rationale FAQ</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Simplified Blue Header Block -->
    <section class="header-banner">
        <div class="banner-container">
            <div class="banner-flex">
                <div class="title-block">
                    <h1>UNIFIED ACTIVATION AND REGISTRATION — FAQ</h1>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content Layout -->
    <div class="portal-layout">
        <aside class="portal-sidebar">
            <ul class="category-list" id="category-list">
                <li class="category-item active" data-category="all">All Questions</li>
                <!-- Other categories will be injected here -->
            </ul>
        </aside>

        <main class="portal-main">
            <!-- Standalone Search Bar -->
            <div class="standalone-search">
                <span class="search-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E32FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </span>
                <input type="text" id="global-search" placeholder="Search">
            </div>

            <!-- FAQ Container -->
            <div class="faq-white-container">
                <div class="faq-list" id="faq-list">
                    <!-- FAQ rows will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <footer class="portal-footer">
        <div class="footer-container">
            <p>&copy; 2026 International Air Transport Association | Internal Rationale Document</p>
        </div>
    </footer>

    <script src="faq-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
